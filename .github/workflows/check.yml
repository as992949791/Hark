name: Check

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # The suites that read and write real rows skip without a database, so CI
    # gives them one. The tests make their own `_test` database beside it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lurk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/local-postgres/package-lock.json
      - run: npm ci
      - run: npm --prefix tools/local-postgres ci
      - run: npm run verify
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/lurk
          # What a local .env gives the same suites. The key is 32 zero bytes.
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SELF_HOSTED: "true"
          NEXT_TELEMETRY_DISABLED: "1"
